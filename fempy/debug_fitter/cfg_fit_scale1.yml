ofilename: FitCF_scale1
suffix: ''

infile: ~/an/LPi/systematics/fit/RawCF_Data_pT017.root
infilesyst: ~/an/AnalysisLPi/systematics/RawSystCF_OldPC.root

combined: false
evaluatediff: true
bootstraptries: 0

fitcfs:
-   cfpath: p02_13/sgn/hCFrew               # 34 parameters, 8 free
    cfsystpath: p02_13/varX/hCFrew_X
    fitname: lpiplus
    # fitrange: [[110, 240], [275, 600]]
    fitrange: [[220, 500]]
    drawrange: [0, 500]
    linethick: 4
    isfitcf: true
    datalabel: "Data #Lambda#pi^{#scale[1.3]{+}}#oplus #bar{#Lambda}#pi^{#scale[1.5]{-}}"
    fitfunclabel: "Total"
    globnorm: [1, 0, 2]
    legcoords: [0.6, 0.65, 0.8, 0.85]
    model:
    -   func: ComplexLednicky_Singlet_doublegaussian_lambda
        name: fLednicky
        legentry: '#lambda_{gen} + #lambda_{flat}'
        addmode: '+'
        color: 12
        onbaseline: false
        multnorm: true
        multglobnorm: false
        shift: 0.5210903620801792
        params:
            lpp_lambdagen: [0.47890963791982083, 0, -1]
            lpp_shared_sp_re_a0: [0, 1, -1]  # [0, -1, 1]
            lpp_sp_im_a0: [0, 0, -1]
            lpp_sp_effrange: [0, 0, -50]
            lpp_radius1: [1.24855, 1.24855, -1.24855]
            lpp_radius2: [3.16925, 3.16925, -3.16925]
            lpp_omegaS: [0.768379, 0.768379, -0.768379]
            lpp_lambdaS: [0.902565, 0.902565, -0.902565]
    -   func: pol0
        name: fBaseline
        legentry: 'lambda_flat'
        addmode: '+'
        onbaseline: false
        multnorm: true
        multglobnorm: true
        params:
            lpp_normLambdaFlat: [1, 1, -1]
            lpp_lambda_flat: [0.5210903620801792, 1, -1]
    -   template: splinehisto_Sigma1385_direct
        name: cocktail
        legentry: "#Sigma(1385) direct"
        templfile: /home/daniel/an/AnalysisLPi/simulations/templates/blastwave/CF_LPiplus_Sigma1385_direct.root
        templpath: hSE00_ratio
        rebin: 1
        relweightcomp: 5
        addmode: '+'
        color: 8
        multnorm: true
        multglobnorm: true
        onbaseline: true
        params:
            lpp_shared_splinenorm: [1, 0.5, -1.5]
            lpp_shared_splineshift: [0, 1, -1]
    -   template: splinehisto_Sigma1385_indirect
        name: cocktail
        legentry: "#Sigma(1385) indirect"
        templfile: /home/daniel/an/AnalysisLPi/simulations/templates/blastwave/CF_LPiplus_Sigma1385_indirect.root
        templpath: hSE00_ratio
        rebin: 1
        relweightcomp: 5
        addmode: '+'
        color: 3
        multnorm: true
        multglobnorm: true
        onbaseline: true
        params:
            lpp_shared_splinenorm: [1, 0.5, -1.5]
            lpp_shared_splineshift: [0, 1, -1]
    -   template: splinehisto_L1520_A
        name: cocktail
        legentry: "#Lambda(1520) A"
        templfile: /home/daniel/an/AnalysisLPi/simulations/templates/blastwave/CF_LPiplus_L1520_A.root
        templpath: hSE00_ratio
        rebin: 1
        relweightcomp: 5
        addmode: '+'
        color: 4
        multnorm: true
        multglobnorm: true
        onbaseline: true
        params:
            lpp_shared_splinenorm: [1, 0.5, -1.5]
            lpp_shared_splineshift: [0, 1, -1]
    -   template: splinehisto_Xi1530
        name: cocktail
        legentry: "#Xi(1530) A"
        templfile: /home/daniel/an/AnalysisLPi/simulations/templates/blastwave/CF_LPiplus_Xi1530zero.root
        templpath: hSE00_ratio
        rebin: 1
        relweightcomp: 5
        addmode: '+'
        color: 6
        multnorm: true
        multglobnorm: true
        onbaseline: true
        params:
            lpp_shared_splinenorm: [1, 0.5, -1.5]
            lpp_shared_splineshift: [0, 1, -1]
    -   func: weighted_pol3gaus_pol3
        name: fMinijet
        addmode: '*'
        color: 7
        legentry: "Ancestor MC"
        linethickness: 1
        multglobnorm: true
        onbaseline: false
        isbaseline: true
        fixparsfromfuncts: true
        params:
            lpp_bkgnorm: [1, 0, -2]
            lpp_commonweight: [1.43184e-01, 0, 1]
            lpp_p0_pol3_C: ['fromfunct', 0, 2]
            lpp_p1_pol3_C: ['fromfunct', 0, 3]
            lpp_p2_pol3_C: ['fromfunct', 0, 4]
            lpp_p3_pol3_C: ['fromfunct', 0, 5]
            lpp_yield_gaus: ['fromfunct', 0, 6]
            lpp_mean_gaus: ['fromfunct', 0, 7]
            lpp_sigma_gaus: ['fromfunct', 0, 8]
            lpp_p0_pol3_NC: ['fromfunct', 1, 2]
            lpp_p1_pol3_NC: ['fromfunct', 1, 3]
            lpp_p2_pol3_NC: ['fromfunct', 1, 4]
            lpp_p3_pol3_NC: ['fromfunct', 1, 5]
        histofuncfile: ['~/an/LPi/systematics/fit/ancestors_0_2000.root',
                        '~/an/LPi/systematics/fit/ancestors_0_2000.root']
        histofuncpath: ['common_lpiplus_gaussian_pol3',
                        'noncommon_lpiplus_pol3']
